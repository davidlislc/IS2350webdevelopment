<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Express HTML Page</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 40px;
      background-color: #f4f4f9;
      color: #333;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 500px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome!</h1>
    <p>This HTML file is being served directly using Express.js.</p>
  </div>
</body>
</html>
